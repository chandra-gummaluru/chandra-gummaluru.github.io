<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" fill="none" stroke="#353535" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Line drawing of a slide window with an interactive graph-search widget, surrounded by a circuit, a grid world and a slider being dragged by a cursor</title>
  <rect x="0" y="0" width="1200" height="520" fill="#fbf5ec" stroke="none"/>
  <path d="M60 476 H1140" stroke-width="2" opacity="0.35"/>

  <!-- Circuit widget (left) -->
  <g>
    <rect x="120" y="170" width="220" height="190" rx="16" fill="#fdfbf7"/>
    <path d="M160 220 H200 L210 204 L226 236 L242 204 L258 236 L268 220 H300 V300"/>
    <path d="M160 220 V252 M148 252 H172 M154 264 H166 M160 264 V300 H218"/>
    <path d="M242 300 H300"/>
    <circle cx="230" cy="300" r="14" fill="#f4e8d8"/>
    <path d="M222 300 H238 M230 292 V308" stroke-width="2"/>
    <circle cx="160" cy="220" r="5" fill="#353535"/><circle cx="300" cy="220" r="5" fill="#353535"/>
    <path d="M176 330 H304" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Main slide window with graph-search widget -->
  <g>
    <rect x="400" y="110" width="400" height="300" rx="18" fill="#fdfbf7"/>
    <path d="M400 150 H800"/>
    <circle cx="426" cy="130" r="6"/><circle cx="448" cy="130" r="6"/><circle cx="470" cy="130" r="6"/>
    <path d="M520 130 H760" stroke-width="2" opacity="0.4"/>
    <!-- edges -->
    <path d="M600 190 L520 260 M600 190 L680 260 M520 260 L480 340 M520 260 L570 340 M680 260 L640 340 M680 260 L730 340"/>
    <path d="M600 190 L680 260 L730 340" stroke-width="7" opacity="0.18"/>
    <!-- nodes -->
    <circle cx="600" cy="190" r="18" fill="#353535"/>
    <circle cx="520" cy="260" r="16" fill="#f4e8d8"/>
    <circle cx="680" cy="260" r="16" fill="#353535"/>
    <circle cx="480" cy="340" r="14" fill="#fdfbf7"/>
    <circle cx="570" cy="340" r="14" fill="#fdfbf7"/>
    <circle cx="640" cy="340" r="14" fill="#f4e8d8"/>
    <circle cx="730" cy="340" r="16" fill="#fdfbf7" stroke-width="4"/>
    <path d="M722 340 L728 347 L740 333" stroke-width="3"/>
    <path d="M440 384 H760" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Grid world widget (right) -->
  <g>
    <rect x="860" y="150" width="210" height="210" rx="16" fill="#fdfbf7"/>
    <path d="M930 150 V360 M1000 150 V360 M860 220 H1070 M860 290 H1070" stroke-width="2"/>
    <rect x="1000" y="150" width="70" height="70" fill="#f4e8d8" stroke="none" opacity="0.9"/>
    <path d="M1020 196 V174 L1048 180 L1020 186" stroke-width="3"/>
    <rect x="930" y="220" width="70" height="70" fill="#353535" opacity="0.85"/>
    <path d="M880 325 H910 M902 317 L910 325 L902 333"/>
    <path d="M965 340 V306 M957 314 L965 306 L973 314"/>
    <path d="M895 270 V238 M887 246 L895 238 L903 246"/>
    <path d="M950 185 H980 M972 177 L980 185 L972 193"/>
    <path d="M1035 325 V300 M1027 308 L1035 300 L1043 308"/>
    <path d="M1020 255 H1050 M1042 247 L1050 255 L1042 263" opacity="0.5"/>
