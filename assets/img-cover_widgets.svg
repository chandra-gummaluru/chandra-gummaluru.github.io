  <!-- Slider with cursor -->
  <g>
    <path d="M470 446 H730" stroke-width="4"/>
    <path d="M470 446 H624" stroke-width="8" opacity="0.2"/>
    <circle cx="624" cy="446" r="14" fill="#f4e8d8"/>
    <path d="M636 452 L636 490 L646 480 L654 498 L662 494 L654 477 L668 476 Z" fill="#fdfbf7" stroke-width="2.5"/>
    <path d="M600 420 C606 412 614 410 624 410 C634 410 642 412 648 420" stroke-width="2" stroke-dasharray="2 8"/>
