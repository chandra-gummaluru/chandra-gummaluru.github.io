  <!-- Sparkles -->
  <g stroke-width="2">
    <path d="M360 90 C362 100 364 102 374 104 C364 106 362 108 360 118 C358 108 356 106 346 104 C356 102 358 100 360 90 Z" fill="#f4e8d8"/>
    <path d="M1000 80 C1002 90 1004 92 1014 94 C1004 96 1002 98 1000 108 C998 98 996 96 986 94 C996 92 998 90 1000 80 Z" fill="#f4e8d8"/>
    <path d="M110 420 C111 427 113 429 120 430 C113 431 111 433 110 440 C109 433 107 431 100 430 C107 429 109 427 110 420 Z"/>
    <circle cx="840" cy="90" r="3"/><circle cx="220" cy="120" r="3"/><circle cx="380" cy="440" r="3"/><circle cx="1110" cy="400" r="3"/>
