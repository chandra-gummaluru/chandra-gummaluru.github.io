<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="#353535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A live poll on the projected slide, with a QR code, audience phones answering, and an AI summary</title>
  <!-- Screen -->
  <rect x="14" y="18" width="226" height="146" rx="6" fill="#fdfbf7"/>
  <path d="M127 164 V186 M97 196 L127 186 L157 196"/>
  <path d="M28 38 H116" stroke-width="3"/>
  <!-- Poll bars -->
  <g stroke-width="2">
    <rect x="28" y="58" width="112" height="16" rx="3" fill="#f4e8d8"/>
    <rect x="28" y="84" width="70" height="16" rx="3" fill="#f4e8d8"/>
    <rect x="28" y="110" width="40" height="16" rx="3" fill="#f4e8d8"/>
    <rect x="28" y="136" width="88" height="16" rx="3" fill="#f4e8d8"/>
  </g>
  <!-- Annotation loop around the winning bar -->
  <path d="M20 66 C18 50 90 48 148 54 C160 56 160 76 146 80 C110 88 40 86 24 78" stroke-width="2" stroke-dasharray="1 0"/>
  <!-- QR code -->
  <g transform="translate(170 58)">
    <rect width="56" height="56" rx="3" fill="#fdfbf7" stroke-width="2"/>
    <g fill="#353535" stroke="none">
      <rect x="6" y="6" width="14" height="14"/><rect x="36" y="6" width="14" height="14"/><rect x="6" y="36" width="14" height="14"/>
      <rect x="26" y="8" width="5" height="5"/><rect x="26" y="20" width="5" height="5"/><rect x="36" y="26" width="5" height="5"/>
      <rect x="26" y="30" width="5" height="5"/><rect x="44" y="38" width="5" height="5"/><rect x="30" y="42" width="5" height="5"/>
      <rect x="38" y="46" width="5" height="5"/><rect x="10" y="26" width="5" height="5"/>
    </g>
    <g fill="#fdfbf7" stroke="none">
      <rect x="9" y="9" width="8" height="8"/><rect x="39" y="9" width="8" height="8"/><rect x="9" y="39" width="8" height="8"/>
    </g>
    <g fill="#353535" stroke="none">
      <rect x="11" y="11" width="4" height="4"/><rect x="41" y="11" width="4" height="4"/><rect x="11" y="41" width="4" height="4"/>
    </g>
  </g>
  <!-- AI sparkle -->
  <g transform="translate(212 138)" stroke-width="2" fill="#f4e8d8">
    <path d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14 Z"/>
  </g>
  <!-- Phones -->
  <g>
    <rect x="262" y="52" width="40" height="76" rx="7" fill="#fdfbf7"/>
    <path d="M276 58 H288" stroke-width="2"/>
    <g stroke-width="1.8">
      <rect x="268" y="72" width="28" height="9" rx="2" fill="#353535"/>
      <rect x="268" y="86" width="28" height="9" rx="2"/>
      <rect x="268" y="100" width="28" height="9" rx="2"/>
    </g>
    <rect x="308" y="96" width="40" height="76" rx="7" fill="#fdfbf7"/>
    <path d="M322 102 H334" stroke-width="2"/>
    <g stroke-width="1.8">
      <rect x="314" y="116" width="28" height="9" rx="2"/>
      <rect x="314" y="130" width="28" height="9" rx="2"/>
      <rect x="314" y="144" width="28" height="9" rx="2" fill="#353535"/>
    </g>
  </g>
  <!-- Signal back to the screen -->
  <g stroke-width="2" opacity="0.8">
    <path d="M254 70 C249 64 249 56 254 50"/>
    <path d="M247 76 C239 66 239 52 247 42"/>
  </g>
</svg>
