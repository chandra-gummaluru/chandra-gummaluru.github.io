<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="#353535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The Beamer+ editor: a widget placed in a region of a slide, with its settings panel alongside</title>
  <rect x="14" y="14" width="332" height="202" rx="8" fill="#fdfbf7"/>
  <!-- Slide -->
  <rect x="28" y="30" width="214" height="134" rx="4" fill="#fdfbf7" stroke-width="2"/>
  <path d="M42 48 H126" stroke-width="3"/>
  <path d="M42 72 H104 M42 86 H96 M42 100 H108 M42 114 H90" stroke-width="1.8" opacity="0.6"/>
  <!-- Widget region -->
  <rect x="122" y="64" width="106" height="88" rx="4" fill="#f4e8d8" stroke-dasharray="6 5" stroke-width="2"/>
  <path d="M134 140 H218 M136 142 V74" stroke-width="1.5"/>
  <path d="M136 108 C146 80 156 80 166 108 S186 136 196 108 S212 84 218 96" stroke-width="2"/>
  <g fill="#fdfbf7" stroke-width="1.8">
    <rect x="118" y="60" width="8" height="8"/><rect x="224" y="60" width="8" height="8"/>
    <rect x="118" y="148" width="8" height="8"/><rect x="224" y="148" width="8" height="8"/>
  </g>
  <!-- Cursor dragging the corner -->
  <path d="M236 156 L236 180 L242 174 L247 186 L252 184 L247 172 L255 172 Z" fill="#fdfbf7" stroke-width="2"/>
  <!-- Filmstrip -->
  <g stroke-width="1.8">
    <rect x="28" y="176" width="36" height="24" rx="2" fill="#f4e8d8"/>
    <rect x="72" y="176" width="36" height="24" rx="2"/>
    <rect x="116" y="176" width="36" height="24" rx="2"/>
    <rect x="160" y="176" width="36" height="24" rx="2"/>
  </g>
  <!-- Settings panel -->
  <path d="M256 14 V216" stroke-width="2"/>
  <g fill="#353535" stroke="none" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">
    <text x="266" y="40">WIDGET</text>
  </g>
  <g stroke-width="1.8">
    <path d="M266 58 H306" opacity="0.6"/>
    <rect x="266" y="64" width="68" height="16" rx="3"/>
    <path d="M266 96 H296" opacity="0.6"/>
    <rect x="266" y="102" width="68" height="16" rx="3"/>
    <path d="M324 108 L328 112 L332 108" stroke-width="1.5"/>
    <path d="M266 134 H300" opacity="0.6"/>
    <rect x="266" y="142" width="26" height="14" rx="7" fill="#f4e8d8"/>
    <circle cx="285" cy="149" r="5" fill="#353535" stroke="none"/>
    <rect x="266" y="182" width="68" height="20" rx="4" fill="#353535"/>
  </g>
  <g fill="#fdfbf7" stroke="none" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="middle">
    <text x="300" y="196">Save</text>
  </g>
</svg>
