<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" fill="none" stroke="#353535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A browser window with a drop zone accepting either a PDF or a presentation ZIP</title>
  <!-- Browser -->
  <rect x="18" y="16" width="324" height="198" rx="8" fill="#fdfbf7"/>
  <path d="M18 42 H342"/>
  <g stroke-width="1.8"><circle cx="34" cy="29" r="4"/><circle cx="48" cy="29" r="4"/><circle cx="62" cy="29" r="4"/></g>
  <rect x="84" y="23" width="170" height="12" rx="6" stroke-width="1.5"/>
  <!-- Drop zone -->
  <rect x="44" y="60" width="272" height="136" rx="10" fill="#f4e8d8" stroke-dasharray="7 7" stroke-width="2"/>
  <!-- PDF file -->
  <path d="M82 78 H118 L134 94 V160 H82 Z" fill="#fdfbf7"/>
  <path d="M118 78 V94 H134"/>
  <path d="M92 110 H124 M92 122 H118 M92 134 H122" stroke-width="1.8" opacity="0.6"/>
  <!-- ZIP file -->
  <path d="M226 78 H262 L278 94 V160 H226 Z" fill="#fdfbf7"/>
  <path d="M262 78 V94 H278"/>
  <g stroke-width="2">
    <path d="M246 80 H252 M252 88 H258 M246 96 H252 M252 104 H258 M246 112 H252"/>
    <rect x="245" y="120" width="14" height="18" rx="2"/>
    <path d="M249 128 H255"/>
  </g>
  <g fill="#353535" stroke="none" font-family="JetBrains Mono, monospace" font-weight="700" text-anchor="middle">
    <text x="108" y="182" font-size="13">.pdf</text>
    <text x="252" y="182" font-size="13">.zip</text>
    <text x="180" y="124" font-size="14" font-weight="400">or</text>
  </g>
  <!-- Upload arrow -->
  <path d="M180 96 V78 M172 86 L180 78 L188 86" stroke-width="2"/>
</svg>
